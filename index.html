<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rick & Morty Explorer</title>
    <!-- Google Fonts: Orbitron para títulos (sci-fi), Nunito para cuerpo (legible) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      Este div#root es el punto de montaje de React.
      React inyectará toda la UI aquí desde main.jsx.
    -->
    <div id="root"></div>

    <!--
      Vite compila src/main.jsx y genera un bundle optimizado.
      type="module" permite usar import/export nativos en el navegador.
    -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
